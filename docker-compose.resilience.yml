name: rune-resilience

x-rune-app: &rune-app
  restart: unless-stopped
  init: true
  stop_signal: SIGTERM
  stop_grace_period: 45s
  networks:
    - rune-resilience
  security_opt:
    - no-new-privileges:true

x-api: &api
  <<: *rune-app
  build:
    context: .
    dockerfile: services/rune/apps/rune-api/Dockerfile
  environment:
    ASPNETCORE_URLS: http://+:8080
    NATS_URL: nats://nats:4222
    RUNE_DISPATCH_PROVIDER: nats
    RUNE_DATA_ROOT: /data
    RUNE_RENDER_CACHE_ROOT: /cache
    TMPDIR: /tmp/rune
  volumes:
    - rune-data:/data
    - rune-cache:/cache
  tmpfs:
    - /tmp/rune:size=256m,uid=10001,gid=10001,mode=0770
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null && curl --fail --silent http://localhost:8080/metrics >/dev/null && nc -z nats 4222 && test -w /data && test -w /cache"]
    interval: 5s
    timeout: 4s
    retries: 30
    start_period: 10s
  depends_on:
    storage:
      condition: service_healthy
    cache:
      condition: service_healthy
    nats:
      condition: service_healthy

x-worker: &worker
  <<: *rune-app
  build:
    context: .
    dockerfile: services/rune/apps/rune-worker/Dockerfile
    target: runtime
  environment:
    NATS_URL: nats://nats:4222
    RUNE_DATA_ROOT: /data
    RUNE_RENDER_CACHE_ROOT: /cache
    RUNE_BROWSER_CONCURRENCY: "1"
    RUNE_NATS_ACK_WAIT_SECONDS: "15"
    RUNE_NATS_NAK_DELAY_SECONDS: "2"
    RUNE_JOB_LEASE_SECONDS: "10"
    RUNE_ABANDONED_TEMP_MINUTES: "1"
    RUNE_FAILURE_POINTS: ""
    RUNE_FAILURE_ACTION: throw
    RUNE_FAILURE_MODE: once
    RUNE_FAILURE_ONCE_ROOT: /data/.failure-once
    TMPDIR: /tmp/rune
  volumes:
    - rune-data:/data
    - rune-cache:/cache
  tmpfs:
    - /tmp/rune:size=512m,uid=10001,gid=10001,mode=0770
  shm_size: 1gb
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f 'dotnet Rune.Worker.dll' >/dev/null && nc -z nats 4222 && test -w /data && test -w /cache && test -w /tmp/rune"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s
  depends_on:
    storage:
      condition: service_healthy
    cache:
      condition: service_healthy
    nats:
      condition: service_healthy

services:
  storage:
    <<: *rune-app
    build:
      context: .
      dockerfile: services/rune/infra/volume-keeper/Dockerfile
    environment:
      RUNE_VOLUME_PATH: /data
    volumes:
      - rune-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -d /data && test -w /data && test \"$(stat -c %u /data)\" = 10001"]
      interval: 3s
      timeout: 2s
      retries: 20

  cache:
    <<: *rune-app
    build:
      context: .
      dockerfile: services/rune/infra/volume-keeper/Dockerfile
    environment:
      RUNE_VOLUME_PATH: /cache
    volumes:
      - rune-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "test -d /cache && test -w /cache && test \"$(stat -c %u /cache)\" = 10001"]
      interval: 3s
      timeout: 2s
      retries: 20

  nats:
    <<: *rune-app
    build:
      context: .
      dockerfile: messaging/nats/server/Dockerfile
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  rune-api-a:
    <<: *api
    ports:
      - "8081:8080"

  rune-api-b:
    <<: *api
    ports:
      - "8082:8080"

  rune-worker-a:
    <<: *worker
    environment:
      NATS_URL: nats://nats:4222
      RUNE_DATA_ROOT: /data
      RUNE_RENDER_CACHE_ROOT: /cache
      RUNE_BROWSER_CONCURRENCY: "1"
      RUNE_NATS_ACK_WAIT_SECONDS: "15"
      RUNE_NATS_NAK_DELAY_SECONDS: "2"
      RUNE_JOB_LEASE_SECONDS: "10"
      RUNE_ABANDONED_TEMP_MINUTES: "1"
      RUNE_FAILURE_POINTS: "${RUNE_WORKER_A_FAILURE_POINTS:-}"
      RUNE_FAILURE_ACTION: "${RUNE_WORKER_A_FAILURE_ACTION:-throw}"
      RUNE_FAILURE_MODE: "${RUNE_WORKER_A_FAILURE_MODE:-once}"
      RUNE_FAILURE_ONCE_ROOT: /data/.failure-once/worker-a
      TMPDIR: /tmp/rune

  rune-worker-b:
    <<: *worker
    environment:
      NATS_URL: nats://nats:4222
      RUNE_DATA_ROOT: /data
      RUNE_RENDER_CACHE_ROOT: /cache
      RUNE_BROWSER_CONCURRENCY: "1"
      RUNE_NATS_ACK_WAIT_SECONDS: "15"
      RUNE_NATS_NAK_DELAY_SECONDS: "2"
      RUNE_JOB_LEASE_SECONDS: "10"
      RUNE_ABANDONED_TEMP_MINUTES: "1"
      RUNE_FAILURE_POINTS: "${RUNE_WORKER_B_FAILURE_POINTS:-}"
      RUNE_FAILURE_ACTION: "${RUNE_WORKER_B_FAILURE_ACTION:-throw}"
      RUNE_FAILURE_MODE: "${RUNE_WORKER_B_FAILURE_MODE:-once}"
      RUNE_FAILURE_ONCE_ROOT: /data/.failure-once/worker-b
      TMPDIR: /tmp/rune

volumes:
  rune-data:
  rune-cache:
  nats-data:

networks:
  rune-resilience:
    driver: bridge
